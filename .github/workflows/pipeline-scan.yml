name: Pipeline Security Scan

on:
  push:
    branches: [workshop]
  workflow_dispatch:
  workflow_call:
    outputs:
      scan-result:
        description: "Pipeline scan result"
        value: ${{ jobs.pipeline-scan.outputs.result }}
        
  # 🚧 REPLACE THIS ENTIRE 'jobs:' SECTION WITH WORKSHOP CONTENT! 🚧
  # Copy from: workshop/pipeline_scan/{tool}/workflow.yml

jobs:
  pipeline-scan:
    name: Pipeline Scan with Claws
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.scan-result.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'


      - name: Set Up Claws Config
        run: |
          cp workshop/pipeline_scan/claws/claws-config.yml /tmp/claws-config.yml

      - name: Set Up Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Set Up Claws
        run: |
          gem install claws-scan -v 0.7.5

      - name: Run Claws pipeline scanner
        id: scan-tool
        run: |
          #!/bin/bash

          echo "🔍 Starting workflow security analysis..."

          # Find all workflow files in .github/workflows directory
          workflow_files=$(find .github/workflows -type f)

          # Check if any workflow files exist
          if [[ -z "$workflow_files" ]]; then
            echo "⚠️  No workflow files found in .github/workflows"
            echo "   Make sure your workflows are in the correct directory"
            exit 0
          fi

          # Prepare command flags for each workflow file
          flags=()
          echo "📁 Found workflow files:"

          while IFS= read -r file; do
            echo "   - $file"
            flags+=("-t" "$file")
          done <<< "$workflow_files"

          echo ""
          echo "🚀 Running Claws security analysis..."

          # Execute the security analysis
          analyze -f stdout -c /tmp/claws-config.yml "${flags[@]}"

      - name: Summarize findings
        if: always()
        run: |
          if [ "${{ steps.scan-tool.outcome }}" == "success" ]; then
            echo "✅ No security alerts"
          else
            echo "❌ Claws detected workflow security issues."
            echo "🔍 View findings: see the 'Run Claws pipeline scanner' step output above (Claws prints findings to stdout)."
          fi

      - name: Set scan result
        id: scan-result
        if: always()
        run: |
          if [ "${{ steps.scan-tool.outcome }}" == "success" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "✅ Pipeline scan passed - no security issues detected"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "❌ Pipeline scan failed - security issues detected in workflows"
            exit 1
          fi

  warden-identity:
    name: Verify Warden Lab Identity
    needs: pipeline-scan
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'unicrons-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure Warden lab credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::105014798395:role/warden-production
          aws-region: us-east-1
          role-session-name: WardenLabIdentity
          role-duration-seconds: 900
          allowed-account-ids: '105014798395'

      - name: Verify assumed identity
        run: aws sts get-caller-identity
